<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CAD Model Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: monospace;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        Hướng dẫn:<br/>
        - Kéo chuột trái để xoay.<br/>
        - Kéo chuột phải để dịch chuyển.<br/>
        - Cuộn chuột để phóng to/thu nhỏ.
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/controls/OrbitControls.js';
        import { CSG } from 'https://cdn.jsdelivr.net/npm/three-bvh-csg@1.3.0/dist/three-bvh-csg.module.js';

        // =======================================================
        // Dinh nghia cac tham so kich thuoc tu ban ve
        // =======================================================
        const LENGTH = 90;            // Chieu dai tong the (truc X)
        const WIDTH = 60;             // Chieu rong tong the (truc Y)
        const HEIGHT_BASE = 15;       // Chieu cao phan de (truc Z)
        const HEIGHT_UPPER = 40;      // Chieu cao phan tren L-shape (truc Z, tinh tu mat tren cua de)
        const DEPTH_UPPER = 20;       // Chieu sau cua phan tren L-shape (truc Y)

        const CYLINDER_DIAMETER = 18; // Duong kinh lo tron
        const CYLINDER_RADIUS = CYLINDER_DIAMETER / 2;

        const SEMI_CIRCLE_RADIUS = 20; // Ban kinh ranh ban nguyet

        const NOTCH_WIDTH = 20;       // Chieu rong ranh chu nhat
        const NOTCH_HEIGHT = 20;      // Chieu cao ranh chu nhat

        const SEGMENTS = 64; // So do phan giai cho hinh tron/tru

        // =======================================================
        // Three.js Setup
        // =======================================================
        let scene, camera, renderer, controls;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xcccccc);

            // Camera (PerspectiveCamera: field of view, aspect ratio, near, far)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(100, 100, 100); // Vi tri camera ban dau
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // OrbitControls (cho phep xoay, phong to/thu nho, dich chuyen bang chuot)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // Hieu ung xoay muot hon
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false; // Khong dich chuyen camera khi pan
            controls.minDistance = 10;
            controls.maxDistance = 500;
            controls.target.set(LENGTH / 2, WIDTH / 2, (HEIGHT_BASE + HEIGHT_UPPER) / 2); // Dat diem nhin vao tam doi tuong

            // =======================================================
            // Anh sang (Lighting)
            // =======================================================
            // Anh sang moi truong (Ambient Light)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Mau trang, cuong do 0.6
            scene.add(ambientLight);

            // Anh sang huong (Directional Light) - tu tren xuong, hoi cheo
            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(200, 300, 100); // Vi tri nguon sang
            directionalLight1.target.position.set(0, 0, 0);
            scene.add(directionalLight1);
            scene.add(directionalLight1.target);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight2.position.set(-200, 100, -300);
            directionalLight2.target.position.set(0, 0, 0);
            scene.add(directionalLight2);
            scene.add(directionalLight2.target);

            // =======================================================
            // Luoi nen (Grid Helper)
            // =======================================================
            const gridHelper = new THREE.GridHelper(200, 20, 0x0000ff, 0x808080); // Kich thuoc, so luong o, mau truc, mau luoi
            gridHelper.position.y = -0.01; // Dat duoi doi tuong mot chut
            scene.add(gridHelper);

            // =======================================================
            // Xay dung vat the 3D su dung Three.js va CSG
            // =======================================================
            const material = new THREE.MeshStandardMaterial({ color: 0x007bff, side: THREE.DoubleSide });

            // Base part (90x60x15)
            const baseGeo = new THREE.BoxGeometry(LENGTH, WIDTH, HEIGHT_BASE);
            const baseMesh = new THREE.Mesh(baseGeo);
            baseMesh.position.set(LENGTH / 2, WIDTH / 2, HEIGHT_BASE / 2); // Three.js geometry la centered

            // Upper L-section (90x20x40)
            const upperGeo = new THREE.BoxGeometry(LENGTH, DEPTH_UPPER, HEIGHT_UPPER);
            const upperMesh = new THREE.Mesh(upperGeo);
            // Dat o canh Y=0 cua base, cao len HEIGHT_BASE
            upperMesh.position.set(LENGTH / 2, DEPTH_UPPER / 2, HEIGHT_BASE + HEIGHT_UPPER / 2);

            // Khoi chinh bang cach UNION 2 phan
            let csgObject = new CSG().union(CSG.fromMesh(baseMesh)).union(CSG.fromMesh(upperMesh));

            // A. Through Hole (Diameter 18)
            const holeGeo = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, LENGTH + 2, SEGMENTS);
            const holeMesh = new THREE.Mesh(holeGeo);
            // Lo tru la doc theo truc X
            holeMesh.rotation.z = Math.PI / 2; // Xoay cylinder de truc Y mac dinh thanh truc X
            // Tam lo: X=45, Y=30, Z=35
            holeMesh.position.set(LENGTH / 2, WIDTH / 2, HEIGHT_BASE + HEIGHT_UPPER / 2);
            csgObject = csgObject.subtract(CSG.fromMesh(holeMesh));

            // B. Semi-circular Cutout (Radius 20)
            const semiCutterGeo = new THREE.CylinderGeometry(SEMI_CIRCLE_RADIUS, SEMI_CIRCLE_RADIUS, DEPTH_UPPER + 2, SEGMENTS);
            const semiCutterMesh = new THREE.Mesh(semiCutterGeo);
            // Cylinder mac dinh truc chieu cao (height) la truc Y. Chung ta muon truc chieu cao cua dao cat nay la truc Y (chieu sau).
            // Do do, khong can xoay cylinder.
            // Tam cua dao cat:
            //   X = WIDTH / 2 = 30
            //   Y = DEPTH_UPPER / 2 = 10 (chieu sau 20mm, tam 10)
            //   Z = HEIGHT_BASE + HEIGHT_UPPER - SEMI_CIRCLE_RADIUS = 15 + 40 - 20 = 35
            semiCutterMesh.position.set(WIDTH / 2, DEPTH_UPPER / 2, HEIGHT_BASE + HEIGHT_UPPER - SEMI_CIRCLE_RADIUS);

            // Tao mot khoi hop de cat (intersect) voi cylinder, chi giu lai phan nua tren
            const clipBoxGeo = new THREE.BoxGeometry(SEMI_CIRCLE_RADIUS * 2 + 2, DEPTH_UPPER + 2, SEMI_CIRCLE_RADIUS + 1);
            const clipBoxMesh = new THREE.Mesh(clipBoxGeo);
            // Dat khoi hop de no che phu phan Z >= Z_center cua cylinder
            clipBoxMesh.position.set(
                WIDTH / 2,
                DEPTH_UPPER / 2,
                (HEIGHT_BASE + HEIGHT_UPPER - SEMI_CIRCLE_RADIUS) + (SEMI_CIRCLE_RADIUS + 1) / 2 // Cao hon tam Z cua cylinder
            );
            const upperHalfCylinderCutter = CSG.fromMesh(semiCutterMesh).intersect(CSG.fromMesh(clipBoxMesh));
            csgObject = csgObject.subtract(upperHalfCylinderCutter);


            // C. Rectangular Notch (20x20x20)
            const notchGeo = new THREE.BoxGeometry(NOTCH_WIDTH, DEPTH_UPPER + 2, NOTCH_HEIGHT);
            const notchMesh = new THREE.Mesh(notchGeo);
            // Vị trí của notch:
            //   X = (WIDTH - NOTCH_WIDTH) / 2 + NOTCH_WIDTH / 2 = 20 + 10 = 30
            //   Y = DEPTH_UPPER / 2 = 10
            //   Z = HEIGHT_BASE + NOTCH_HEIGHT / 2 = 15 + 10 = 25
            notchMesh.position.set(
                (WIDTH - NOTCH_WIDTH) / 2 + NOTCH_WIDTH / 2, // X-center
                DEPTH_UPPER / 2, // Y-center
                HEIGHT_BASE + NOTCH_HEIGHT / 2 // Z-center
            );
            csgObject = csgObject.subtract(CSG.fromMesh(notchMesh));

            // Tao mesh cuoi cung tu CSG
            const finalMesh = csgObject.toMesh(material);
            finalMesh.castShadow = true;
            finalMesh.receiveShadow = true;
            scene.add(finalMesh);

            // Xu ly thay doi kich thuoc cua so
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Vong lap hien thi (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Cap nhat OrbitControls
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
