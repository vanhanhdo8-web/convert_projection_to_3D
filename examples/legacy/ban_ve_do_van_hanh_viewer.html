<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mechanical Part Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(20, 20, 30, 0.85);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        #info-overlay h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #4facfe;
        }
        #info-overlay p {
            margin: 4px 0;
            font-size: 13px;
            color: #cccccc;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info-overlay">
        <h2>Mô Hình 3D Chi Tiết Cơ Khí</h2>
        <p>• Kích thước: 90 x 60 x 50 mm</p>
        <p>• Chuột trái: Xoay mô hình 360°</p>
        <p>• Chuột phải: Di chuyển view (Pan)</p>
        <p>• Cuộn chuột: Phóng to / Thu nhỏ</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. Khoi tao Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e28);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(120, 100, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 2. Control xoay 360 độ
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Khong xoay xuong duoi mat dat qua nhieu

        // 3. Anh sang (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(100, 150, 100);
        dirLight1.castShadow = true;
        dirLight1.shadow.mapSize.width = 2048;
        dirLight1.shadow.mapSize.height = 2048;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x3a7bd5, 0.4);
        dirLight2.position.set(-100, -50, -100);
        scene.add(dirLight2);

        // 4. Luoi nen va Truc toan do (Grid & Axes Helper)
        const gridHelper = new THREE.GridHelper(200, 20, 0x4facfe, 0x444455);
        gridHelper.position.y = -0.1;
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(30);
        axesHelper.position.set(-50, 0, -40);
        scene.add(axesHelper);

        // 5. Dung Geometry vat the 3D bang CSG/Shape Extrusion (Mo phong chinh xac)
        const modelGroup = new THREE.Group();

        // Material co khi kim loai
        const metalMaterial = new THREE.MeshStandardMaterial({
            color: 0x3b6e8c,
            metalness: 0.5,
            roughness: 0.3,
        });

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 1 });

        // Tao khoi chinh bang CSG / Composite Meshes
        function createPart() {
            // Than chinh (Extrude shape)
            const shape = new THREE.Shape();
            // Mat cat Front View (X-Z)
            shape.moveTo(-45, 0);
            shape.lineTo(45, 0);
            shape.lineTo(45, 35);
            shape.lineTo(10, 50);
            shape.lineTo(-10, 50);
            shape.lineTo(-45, 35);
            shape.closePath();

            const extrudeSettings = {
                steps: 1,
                depth: 60,
                bevelEnabled: false
            };

            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.center(); // Dua ve tam

            const mesh = new THREE.Mesh(geom, metalMaterial);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Nét vẽ viền kỹ thuật (Edges)
            const edges = new THREE.EdgesGeometry(geom);
            const line = new THREE.LineSegments(edges, lineMaterial);
            mesh.add(line);

            // Khoet lo va ranh (Dung CSG hoac Mesh phu de mo phong khoet ranh ky thuat)
            // Lỗ tròn ngang Phi 18
            const holeGeom = new THREE.CylinderGeometry(9, 9, 62, 32);
            const holeMat = new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.5 });
            const holeMesh = new THREE.Mesh(holeGeom, holeMat);
            holeMesh.rotation.x = Math.PI / 2;
            holeMesh.position.set(0, 7, 0);
            mesh.add(holeMesh);

            // Rãnh khoét trên đỉnh
            const slotGeom = new THREE.BoxGeometry(40, 16, 22);
            const slotMat = new THREE.MeshStandardMaterial({ color: 0x1f2d3d, roughness: 0.6 });
            const slotMesh = new THREE.Mesh(slotGeom, slotMat);
            slotMesh.position.set(0, 18, 20);
            mesh.add(slotMesh);

            return mesh;
        }

        const part = createPart();
        part.position.y = 25; // Nâng vật thể đứng trên mặt lưới
        modelGroup.add(part);
        scene.add(modelGroup);

        // 6. Responsive Window Resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 7. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
